<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus to MCQ & Notes Finder</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --panel-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 24px;
        }

        .panel {
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        select, input[type="file"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
        }

        select:disabled {
            background-color: #f1f5f9;
            cursor: not-allowed;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .lo-container {
            border: 1px solid var(--border);
            border-radius: 6px;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
            background: #f8fafc;
        }

        .lo-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .lo-item input {
            margin-top: 3px;
            margin-right: 10px;
        }

        .lo-actions {
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            background-color: #e2e8f0;
            color: var(--text);
            margin-right: 8px;
        }

        .btn-small:hover {
            background-color: #cbd5e1;
        }

        .btn-search {
            width: 100%;
            font-size: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        #results {
            margin-top: 20px;
            padding: 16px;
            border-radius: 6px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            display: none;
        }

        .result-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #bfdbfe;
        }

        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .tag-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px;
        }

        .type-badge {
            display: inline-block;
            background: #475569;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            margin-right: 6px;
        }

        .loader {
            text-align: center;
            font-weight: 600;
            color: var(--text-light);
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Syllabus & MCQ / Notes Finder</h1>

    <!-- Endpoint / Path Setup Panel -->
    <div class="panel">
        <div class="form-group">
            <label for="baseUrlInput">Base jsDelivr URL (Editable Path)</label>
            <input type="text" id="baseUrlInput" value="https://cdn.jsdelivr.net/gh/pulstyle02-maker/Checkout-page@main/">
            <div class="helper-text">You can change repository, branch/tag, or append subdirectories after the slash (e.g., add <code>subfolder/</code>).</div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="syllabusFile">1. Upload Syllabus JSON</label>
                <input type="file" id="syllabusFile" accept=".json">
            </div>

            <div class="form-group">
                <label for="searchMode">2. Content Type to Search</label>
                <select id="searchMode">
                    <option value="both" selected>Both MCQs (b*a-z) & Notes (b*Na-z)</option>
                    <option value="mcq">MCQs Only (b*a.json to b*z.json)</option>
                    <option value="notes">Notes Only (b*Na.json to b*Nz.json)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="filePrefix">3. Target Block Prefix</label>
            <select id="filePrefix">
                <option value="b1">b1</option>
                <option value="b2">b2</option>
                <option value="b3">b3</option>
                <option value="b4">b4</option>
                <option value="b5">b5</option>
                <option value="b6">b6</option>
                <option value="b7">b7</option>
                <option value="b8" selected>b8</option>
                <option value="b9">b9</option>
                <option value="b10">b10</option>
                <option value="b11">b11</option>
                <option value="b12">b12</option>
            </select>
        </div>
    </div>

    <!-- Filters Panel -->
    <div class="panel">
        <div class="grid-2">
            <div class="form-group">
                <label for="blockSelect">4. Select Syllabus Block</label>
                <select id="blockSelect" disabled>
                    <option value="">Upload JSON first...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="moduleSelect">5. Select Module</label>
                <select id="moduleSelect" disabled>
                    <option value="">Select Block first...</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="subjectSelect">6. Select Subject</label>
            <select id="subjectSelect" disabled>
                <option value="">Select Module first...</option>
            </select>
        </div>

        <div class="form-group">
            <label>7. Select Learning Objectives (LOs)</label>
            <div class="lo-actions">
                <button type="button" class="btn btn-small" id="selectAllBtn" disabled>Select All</button>
                <button type="button" class="btn btn-small" id="deselectAllBtn" disabled>Deselect All</button>
            </div>
            <div class="lo-container" id="loContainer">
                <div style="color: var(--text-light); font-size: 14px; padding: 10px;">
                    Select a Subject to view Learning Objectives...
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-search" id="searchBtn" disabled>🔍 Search jsDelivr Files</button>
    </div>

    <!-- Results Panel -->
    <div id="results"></div>

</div>

<script>
    // State management
    let syllabusData = [];
    const ALPHABET = "abcdefghijklmnopqrstuvwxyz".split('');

    // DOM Elements
    const baseUrlInput = document.getElementById('baseUrlInput');
    const fileInput = document.getElementById('syllabusFile');
    const prefixSelect = document.getElementById('filePrefix');
    const searchModeSelect = document.getElementById('searchMode');
    const blockSelect = document.getElementById('blockSelect');
    const moduleSelect = document.getElementById('moduleSelect');
    const subjectSelect = document.getElementById('subjectSelect');
    const loContainer = document.getElementById('loContainer');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const deselectAllBtn = document.getElementById('deselectAllBtn');
    const searchBtn = document.getElementById('searchBtn');
    const resultsDiv = document.getElementById('results');

    // Utility: Extract the TAG from the LO string (e.g., "ID-Pa-003. Fungal infections" -> "ID-Pa-003")
    function extractTag(objectiveStr) {
        return objectiveStr.split('.')[0].trim();
    }

    // Helper: Make sure custom base URL always ends with a slash
    function getCleanBaseUrl() {
        let url = baseUrlInput.value.trim();
        if (!url.endsWith('/')) {
            url += '/';
        }
        return url;
    }

    // Handle JSON Upload
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const parsed = JSON.parse(event.target.result);
                syllabusData = parsed.syllabus ? parsed.syllabus : parsed;
                if (!Array.isArray(syllabusData)) throw new Error("Invalid format: 'syllabus' array not found.");
                
                populateBlocks();
            } catch (err) {
                alert("Error parsing JSON: " + err.message);
            }
        };
        reader.readAsText(file);
    });

    // Populate Block Dropdown
    function populateBlocks() {
        const blocks = [...new Set(syllabusData.map(item => item.block))].filter(Boolean);
        blockSelect.innerHTML = '<option value="">-- Select a Block --</option>';
        blocks.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b;
            opt.textContent = b;
            blockSelect.appendChild(opt);
        });
        
        blockSelect.disabled = false;
        moduleSelect.innerHTML = '<option value="">Select Block first...</option>';
        moduleSelect.disabled = true;
        subjectSelect.innerHTML = '<option value="">Select Module first...</option>';
        subjectSelect.disabled = true;
        resetLOs();
    }

    // Handle Block Change
    blockSelect.addEventListener('change', (e) => {
        const selectedBlock = e.target.value;
        if (!selectedBlock) {
            moduleSelect.disabled = true;
            return;
        }

        const romanMatch = selectedBlock.match(/Block\s+(I{1,3}|IV|VI{0,3}|IX|X{1,3})/i);
        if (romanMatch) {
            const romanToNum = { 'I':1, 'II':2, 'III':3, 'IV':4, 'V':5, 'VI':6, 'VII':7, 'VIII':8, 'IX':9, 'X':10, 'XI':11, 'XII':12 };
            const num = romanToNum[romanMatch[1].toUpperCase()];
            if (num) prefixSelect.value = `b${num}`;
        }

        const filteredByBlock = syllabusData.filter(item => item.block === selectedBlock);
        const modules = [...new Set(filteredByBlock.map(item => item.moduleName))].filter(Boolean);
        
        moduleSelect.innerHTML = '<option value="">-- Select a Module --</option>';
        modules.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            moduleSelect.appendChild(opt);
        });

        moduleSelect.disabled = false;
        subjectSelect.innerHTML = '<option value="">Select Module first...</option>';
        subjectSelect.disabled = true;
        resetLOs();
    });

    // Handle Module Change
    moduleSelect.addEventListener('change', (e) => {
        const selectedBlock = blockSelect.value;
        const selectedModule = e.target.value;
        if (!selectedModule) {
            subjectSelect.disabled = true;
            return;
        }

        const filteredByModule = syllabusData.filter(item => 
            item.block === selectedBlock && item.moduleName === selectedModule
        );
        const subjects = [...new Set(filteredByModule.map(item => item.subject))].filter(Boolean);

        subjectSelect.innerHTML = '<option value="">-- Select a Subject --</option>';
        subjects.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            subjectSelect.appendChild(opt);
        });

        subjectSelect.disabled = false;
        resetLOs();
    });

    // Handle Subject Change
    subjectSelect.addEventListener('change', (e) => {
        const selectedBlock = blockSelect.value;
        const selectedModule = moduleSelect.value;
        const selectedSubject = e.target.value;

        if (!selectedSubject) {
            resetLOs();
            return;
        }

        const matchedItem = syllabusData.find(item => 
            item.block === selectedBlock && 
            item.moduleName === selectedModule && 
            item.subject === selectedSubject
        );

        loContainer.innerHTML = '';
        if (matchedItem && matchedItem.learningObjectives) {
            matchedItem.learningObjectives.forEach((lo, index) => {
                const tag = extractTag(lo.objective);
                
                const div = document.createElement('div');
                div.className = 'lo-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `lo_${index}`;
                checkbox.value = tag;
                checkbox.className = 'lo-checkbox';

                const label = document.createElement('label');
                label.htmlFor = `lo_${index}`;
                label.style.fontWeight = 'normal';
                label.textContent = lo.objective;

                div.appendChild(checkbox);
                div.appendChild(label);
                loContainer.appendChild(div);
            });

            selectAllBtn.disabled = false;
            deselectAllBtn.disabled = false;
            searchBtn.disabled = false;
        } else {
            resetLOs();
        }
    });

    function resetLOs() {
        loContainer.innerHTML = '<div style="color: var(--text-light); font-size: 14px; padding: 10px;">Select a Subject to view Learning Objectives...</div>';
        selectAllBtn.disabled = true;
        deselectAllBtn.disabled = true;
        searchBtn.disabled = true;
    }

    selectAllBtn.addEventListener('click', () => {
        document.querySelectorAll('.lo-checkbox').forEach(cb => cb.checked = true);
    });
    
    deselectAllBtn.addEventListener('click', () => {
        document.querySelectorAll('.lo-checkbox').forEach(cb => cb.checked = false);
    });

    // Search Logic
    searchBtn.addEventListener('click', async () => {
        const selectedCheckboxes = document.querySelectorAll('.lo-checkbox:checked');
        if (selectedCheckboxes.length === 0) {
            alert('Please select at least one Learning Objective (LO).');
            return;
        }

        const targetTags = Array.from(selectedCheckboxes).map(cb => cb.value);
        const prefix = prefixSelect.value;
        const mode = searchModeSelect.value;
        const baseUrl = getCleanBaseUrl();

        // Prepare file queue based on search mode
        let filesToFetch = [];
        ALPHABET.forEach(letter => {
            if (mode === 'mcq' || mode === 'both') {
                filesToFetch.push({ fileName: `${prefix}${letter}.json`, type: 'MCQ' });
            }
            if (mode === 'notes' || mode === 'both') {
                filesToFetch.push({ fileName: `${prefix}N${letter}.json`, type: 'Notes' });
            }
        });

        resultsDiv.style.display = 'block';
        resultsDiv.innerHTML = `<div class="loader">Scanning ${filesToFetch.length} potential files via jsDelivr... Please wait.</div>`;

        let foundResults = {};

        const fetchPromises = filesToFetch.map(async ({ fileName, type }) => {
            const url = `${baseUrl}${fileName}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) return;

                const fileData = await response.json();
                
                // Normalise data to array (works if root is an array or an object containing an array)
                let itemsArray = Array.isArray(fileData) 
                    ? fileData 
                    : (fileData.notes || fileData.mcqs || fileData.data || []);
                
                if (!Array.isArray(itemsArray)) return;

                const matchedInFile = new Set();
                itemsArray.forEach(item => {
                    // Match against .tag or .tags array/string
                    if (item.tag && targetTags.includes(item.tag)) {
                        matchedInFile.add(item.tag);
                    } else if (Array.isArray(item.tags)) {
                        item.tags.forEach(t => {
                            if (targetTags.includes(t)) matchedInFile.add(t);
                        });
                    }
                });

                if (matchedInFile.size > 0) {
                    foundResults[fileName] = {
                        tags: Array.from(matchedInFile),
                        type: type,
                        url: url
                    };
                }
            } catch (err) {
                // Ignore missing files or formatting mismatches
            }
        });

        await Promise.allSettled(fetchPromises);

        // Render Results
        if (Object.keys(foundResults).length === 0) {
            resultsDiv.innerHTML = `<strong>No records found</strong> matching the selected Learning Objectives with prefix <code>${prefix}</code>.`;
            return;
        }

        let html = `<h3>Found Matches (${Object.keys(foundResults).length} files):</h3>`;
        for (const [fileName, data] of Object.entries(foundResults)) {
            const tagsHtml = data.tags.map(t => `<span class="tag-badge">${t}</span>`).join('');
            html += `
                <div class="result-item">
                    <span class="type-badge">${data.type}</span>
                    <strong>File:</strong> <a href="${data.url}" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 600;">${fileName}</a><br>
                    <div style="margin-top: 6px;"><strong>Contains LO Tags:</strong> ${tagsHtml}</div>
                </div>
            `;
        }

        resultsDiv.innerHTML = html;
    });
</script>
</body>
</html>
