<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WENSO — Event Discovery</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#EBE7E0',      // Outer environment background
              sidebar: '#312F2F', // Dark gray sidebar / Mobile nav
              main: '#FFFFFF',    // White content area
              panel: '#FAFAFA',   // Off-white right panel / Modal
              player: '#393737',  // Bottom floating bar
              accent: '#0096B4',  // WENSO Cyan
              accentHover: '#007A93',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'window': '0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255,255,255,0.05)',
            'floating': '0 20px 40px -10px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.1)',
            'card': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'up': '0 -10px 40px -10px rgba(0,0,0,0.15)',
          }
        }
      }
    }
  </script>

  <style>
    /* Clean, app-like scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #e4e4e7;
      border-radius: 4px;
    }
    .dark-scroll::-webkit-scrollbar-thumb {
      background: #52525b;
    }
    
    /* Hide scrollbar for horizontal mobile scroll areas */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none; 
      scrollbar-width: none; 
    }
    
    body {
      background-color: #EBE7E0;
      overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
    }

    /* Mobile details panel sliding logic */
    .mobile-panel {
      transform: translateY(100%);
    }
    .mobile-panel.is-open {
      transform: translateY(0);
    }
    @media (min-width: 1024px) {
      .mobile-panel {
        transform: translateY(0) !important;
      }
    }
  </style>
</head>

<body class="text-zinc-900 font-sans antialiased h-[100dvh] w-full flex items-center justify-center sm:p-4 lg:p-8 overflow-hidden">

  <!-- ==================== MAIN APP WINDOW ==================== -->
  <div class="w-full max-w-[1440px] h-full sm:max-h-[900px] bg-app-sidebar sm:rounded-[32px] sm:shadow-window flex flex-col relative overflow-hidden sm:ring-1 sm:ring-white/10">
    
    <!-- App Container (Sidebar + Main Content) -->
    <div class="flex flex-1 overflow-hidden sm:p-2 sm:pl-3 relative">
      
      <!-- ==================== DESKTOP LEFT SIDEBAR ==================== -->
      <aside class="hidden md:flex w-60 flex-shrink-0 flex-col pt-4 pb-24 px-3 relative z-10">
        
        <!-- Mac-style Window Controls -->
        <div class="flex gap-2 mb-8 px-2">
          <div class="w-3 h-3 rounded-full bg-[#FF5F56] shadow-sm"></div>
          <div class="w-3 h-3 rounded-full bg-[#FFBD2E] shadow-sm"></div>
          <div class="w-3 h-3 rounded-full bg-[#27C93F] shadow-sm"></div>
        </div>

        <!-- WENSO LOGO SVG -->
        <div class="px-2 mb-10">
          <svg class="h-9 w-auto" viewBox="0 0 170 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <text x="0" y="38" font-family="Inter, sans-serif" font-weight="900" font-size="38" fill="white" letter-spacing="-1.5">wen</text>
            <path d="M 80 8 L 165 8 L 142 25 L 165 42 L 80 42 Z" fill="#0096B4"/>
            <text x="86" y="38" font-family="Inter, sans-serif" font-weight="900" font-size="38" fill="white" letter-spacing="-1">so</text>
          </svg>
        </div>

        <!-- Navigation Sections -->
        <div class="flex-1 overflow-y-auto dark-scroll pr-2">
          <div class="mb-8">
            <h3 class="text-[11px] uppercase tracking-widest text-zinc-500 font-bold mb-3 px-3">Discovery</h3>
            <nav class="space-y-1" id="nav-group-discovery">
              <!-- Rendered via JS -->
            </nav>
          </div>

          <div class="mb-8">
            <h3 class="text-[11px] uppercase tracking-widest text-zinc-500 font-bold mb-3 px-3">Directories</h3>
            <nav class="space-y-1">
              <button onclick="switchView('colleges')" id="nav-colleges" class="w-full flex items-center px-3 py-2 text-sm font-medium rounded-xl text-zinc-400 hover:text-white transition-colors">Colleges</button>
              <button onclick="switchView('societies')" id="nav-societies" class="w-full flex items-center px-3 py-2 text-sm font-medium rounded-xl text-zinc-400 hover:text-white transition-colors">Societies</button>
            </nav>
          </div>
          
          <div class="mb-8">
            <h3 class="text-[11px] uppercase tracking-widest text-zinc-500 font-bold mb-3 px-3">Workspace</h3>
            <nav class="space-y-1">
              <button onclick="switchView('manage')" id="nav-manage" class="w-full flex items-center px-3 py-2 text-sm font-medium rounded-xl text-zinc-400 hover:text-white transition-colors">Event Manager</button>
            </nav>
          </div>
        </div>
      </aside>

      <!-- ==================== MAIN CONTENT AREA ==================== -->
      <main class="flex-1 bg-app-main sm:rounded-[24px] sm:rounded-b-[20px] flex flex-col overflow-hidden sm:shadow-card relative z-0">
        
        <!-- Header / Top Bar (Adaptive) -->
        <header class="flex flex-col md:flex-row md:items-center justify-between px-4 md:px-8 py-3 md:py-5 bg-white/90 backdrop-blur-md sticky top-0 z-20 border-b border-zinc-100 gap-3 md:gap-6">
          
          <!-- Top Row Mobile (Logo + Search + Avatar) -->
          <div class="flex items-center justify-between w-full md:w-auto">
            
            <!-- Mobile Logo -->
            <div class="md:hidden flex items-center mr-3">
              <svg class="h-6 w-auto" viewBox="0 0 170 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="0" y="38" font-family="Inter, sans-serif" font-weight="900" font-size="38" fill="#18181b" letter-spacing="-1.5">wen</text>
                <path d="M 80 8 L 165 8 L 142 25 L 165 42 L 80 42 Z" fill="#0096B4"/>
                <text x="86" y="38" font-family="Inter, sans-serif" font-weight="900" font-size="38" fill="white" letter-spacing="-1">so</text>
              </svg>
            </div>
            
            <!-- Search & Profile -->
            <div class="flex flex-1 md:flex-none items-center justify-end gap-2 md:gap-4">
              <div class="relative group flex-1 md:flex-none max-w-[250px]">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 group-focus-within:text-app-accent transition-colors"></i>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Search events..." class="w-full md:w-64 pl-9 pr-4 py-2 bg-zinc-50 border border-zinc-200 rounded-full text-[13px] md:text-sm focus:outline-none focus:border-app-accent focus:ring-1 focus:ring-app-accent/20 transition-all placeholder:text-zinc-400 font-medium">
              </div>
              <button class="w-9 h-9 rounded-full bg-zinc-100 border border-zinc-200 flex items-center justify-center shrink-0">
                <img src="https://ui-avatars.com/api/?name=Wenso&background=0096B4&color=fff" class="w-8 h-8 rounded-full" alt="Profile">
              </button>
            </div>
          </div>

          <!-- Scrollable Filters -->
          <div class="flex items-center gap-5 text-[13px] md:text-sm font-bold text-zinc-400 overflow-x-auto no-scrollbar w-full" id="top-filters">
            <button onclick="setFilter('ALL')" class="text-zinc-900 border-b-2 border-zinc-900 pb-1 whitespace-nowrap shrink-0 transition-colors" id="filter-ALL">All Events</button>
            <button onclick="setFilter('Workshop')" class="hover:text-zinc-900 pb-1 whitespace-nowrap shrink-0 transition-colors" id="filter-Workshop">Workshops</button>
            <button onclick="setFilter('Conference')" class="hover:text-zinc-900 pb-1 whitespace-nowrap shrink-0 transition-colors" id="filter-Conference">Conferences</button>
            <button onclick="setFilter('Competition')" class="hover:text-zinc-900 pb-1 whitespace-nowrap shrink-0 transition-colors" id="filter-Competition">Competitions</button>
          </div>
        </header>

        <!-- Feed Container -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 pb-32 md:pb-32" id="feed-container">
          <!-- JS injects content here -->
        </div>

      </main>

      <!-- ==================== RIGHT PANEL / MOBILE BOTTOM SHEET ==================== -->
      <aside id="detail-panel" class="mobile-panel fixed inset-x-0 bottom-0 top-16 z-50 bg-app-panel flex flex-col transition-transform duration-300 shadow-up lg:shadow-none lg:static lg:w-[320px] lg:flex border-l border-zinc-100 rounded-t-3xl lg:rounded-none">
        
        <!-- Sheet Header & Mobile Close Handle -->
        <div class="flex flex-col items-center pt-3 pb-2 lg:hidden bg-app-panel/90 backdrop-blur-md cursor-pointer" onclick="closeMobileDetail()">
          <div class="w-10 h-1.5 bg-zinc-200 rounded-full mb-2"></div>
        </div>
        
        <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-100 bg-app-panel/90 backdrop-blur-md sticky top-0 z-10 hidden lg:flex">
          <h2 class="text-sm font-bold text-zinc-800 flex items-center">
            <i data-lucide="layout-list" class="w-4 h-4 mr-2 text-zinc-400"></i> Event Details
          </h2>
          <button class="p-1.5 text-zinc-400 hover:text-zinc-900 rounded-md hover:bg-zinc-200 transition-colors">
            <i data-lucide="more-horizontal" class="w-4 h-4"></i>
          </button>
        </div>
        
        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-5 md:p-6 pb-24 md:pb-32" id="right-panel-content">
          <!-- Dynamic details injected here -->
          <div class="text-center text-zinc-400 text-sm mt-20 hidden lg:block">
            Select an event to view details
          </div>
        </div>
      </aside>

    </div>

    <!-- ==================== BOTTOM FLOATING BAR (Event Action) ==================== -->
    <div class="absolute bottom-[64px] sm:bottom-6 left-0 sm:left-1/2 sm:-translate-x-1/2 w-full sm:w-[90%] max-w-[1000px] h-[64px] sm:h-[76px] bg-app-player sm:rounded-[20px] sm:shadow-floating flex items-center justify-between px-4 z-40 border-t sm:border border-white/10 backdrop-blur-xl transition-all">
      
      <!-- Left: Active Event Info -->
      <div class="flex items-center gap-3 md:gap-4 w-1/2 md:w-1/3 min-w-[150px] md:min-w-[250px]" id="bottom-bar-info">
        <div class="w-10 h-10 md:w-12 md:h-12 bg-zinc-800 rounded-lg md:rounded-xl overflow-hidden shrink-0 shadow-sm">
          <img src="" id="bb-img" class="w-full h-full object-cover hidden">
        </div>
        <div class="truncate flex-1">
          <h4 class="text-[13px] md:text-sm font-bold text-white truncate" id="bb-title">No Event Selected</h4>
          <p class="text-[11px] md:text-xs text-zinc-400 truncate" id="bb-subtitle">Explore the feed</p>
        </div>
      </div>

      <!-- Center: Aesthetic Timeline / Status (Desktop Only) -->
      <div class="flex-1 flex flex-col items-center justify-center px-8 hidden md:flex">
        <div class="flex items-center gap-4 w-full max-w-md">
          <span class="text-[10px] font-semibold text-zinc-400" id="bb-time-start">--:--</span>
          <div class="flex-1 flex items-center justify-between gap-0.5 h-6">
            <script>
              for(let i=0; i<40; i++) {
                let height = Math.max(4, Math.random() * 24);
                let opacity = i < 15 ? 'bg-app-accent' : 'bg-zinc-600';
                document.write(`<div class="w-1 rounded-full ${opacity} transition-all duration-500" style="height: ${height}px"></div>`);
              }
            </script>
          </div>
          <span class="text-[10px] font-semibold text-zinc-400" id="bb-time-end">--:--</span>
        </div>
      </div>

      <!-- Right: Actions -->
      <div class="flex items-center justify-end gap-2 md:gap-3 shrink-0">
        <button class="p-2 text-zinc-400 hover:text-white transition-colors hidden sm:block">
          <i data-lucide="share-2" class="w-4 h-4"></i>
        </button>
        <button class="px-4 py-1.5 md:px-5 md:py-2 bg-white hover:bg-zinc-100 text-zinc-900 rounded-full text-xs font-bold transition-colors shadow-sm" onclick="registerActiveEvent()">
          Register
        </button>
      </div>
    </div>

    <!-- ==================== MOBILE BOTTOM NAVIGATION ==================== -->
    <nav class="md:hidden absolute bottom-0 left-0 right-0 h-[64px] bg-app-sidebar/95 backdrop-blur-xl border-t border-white/5 z-40 flex items-center justify-around px-2 pb-[env(safe-area-inset-bottom)]">
      
      <button onclick="switchView('home')" id="mob-nav-home" class="flex flex-col items-center justify-center w-16 h-full text-app-accent">
        <i data-lucide="compass" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-bold">Browse</span>
      </button>

      <button onclick="switchView('colleges')" id="mob-nav-colleges" class="flex flex-col items-center justify-center w-16 h-full text-zinc-400 hover:text-white transition-colors">
        <i data-lucide="library" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-bold">Colleges</span>
      </button>

      <button onclick="switchView('saved')" id="mob-nav-saved" class="flex flex-col items-center justify-center w-16 h-full text-zinc-400 hover:text-white transition-colors">
        <i data-lucide="heart" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-bold">Saved</span>
      </button>

      <button onclick="switchView('manage')" id="mob-nav-manage" class="flex flex-col items-center justify-center w-16 h-full text-zinc-400 hover:text-white transition-colors">
        <i data-lucide="layout-dashboard" class="w-5 h-5 mb-1"></i>
        <span class="text-[10px] font-bold">Manage</span>
      </button>
      
    </nav>
  </div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    const EVENTS = [
      {
        id: 'e1',
        title: '12th Clinical Suturing & Emergency Skill Summit',
        society: 'KEMU Surgical Society',
        college: 'KE Medical Univ',
        type: 'Workshop',
        date: 'Nov 04, 2026',
        time: '09:00 AM',
        duration: '6h',
        venue: 'Patiala Block Labs',
        image: 'https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=800&q=80',
        featured: true,
        likes: '1.2k',
        desc: 'Comprehensive hands-on simulation training on basic and advanced knot tying, arterial repair, and laparoscopic fundamentals guided by senior consultants.'
      },
      {
        id: 'e2',
        title: 'National Medical Research Symposium 2026',
        society: 'AKU Research Forum',
        college: 'Aga Khan Univ',
        type: 'Conference',
        date: 'Nov 18, 2026',
        time: '10:00 AM',
        duration: '8h',
        venue: 'AKU Main Auditorium',
        image: 'https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=800&q=80',
        featured: false,
        likes: '850',
        desc: 'Showcasing undergraduate medical research papers, epidemiology poster presentations, and biostatistics keynote speeches.'
      },
      {
        id: 'e3',
        title: 'Annual Bilingual Parliamentary Debates',
        society: 'Nishtar Literary Society',
        college: 'Nishtar Medical',
        type: 'Competition',
        date: 'Nov 25, 2026',
        time: '08:30 AM',
        duration: '2 Days',
        venue: 'Main Library Hall',
        image: 'https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&w=800&q=80',
        featured: false,
        likes: '320',
        desc: 'Prestigious debate championship bringing together medical institutions to debate healthcare economics, bioethics, and national policy.'
      },
      {
        id: 'e4',
        title: 'Basic ECG & Cardiac Arrhythmia Masterclass',
        society: 'AIMC Cardiology',
        college: 'Allama Iqbal',
        type: 'Workshop',
        date: 'Nov 10, 2026',
        time: '11:00 AM',
        duration: '4h',
        venue: 'Lecture Theatre 1',
        image: 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=800&q=80',
        featured: false,
        likes: '2.1k',
        desc: 'Step-by-step ECG interpretation, STEMI localization, and emergency management algorithms designed for clinical rotations.'
      }
    ];

    const COLLEGES = [
      { name: 'KE Medical', img: 'https://ui-avatars.com/api/?name=KE&background=059669&color=fff&size=128' },
      { name: 'Aga Khan', img: 'https://ui-avatars.com/api/?name=AK&background=0096B4&color=fff&size=128' },
      { name: 'Nishtar', img: 'https://ui-avatars.com/api/?name=NM&background=d97706&color=fff&size=128' },
      { name: 'Khyber Med', img: 'https://ui-avatars.com/api/?name=KM&background=e11d48&color=fff&size=128' },
      { name: 'AIMC', img: 'https://ui-avatars.com/api/?name=AI&background=7c3aed&color=fff&size=128' },
    ];

    let state = {
      view: 'home',
      filterType: 'ALL',
      searchQuery: '',
      activeEvent: null
    };

    window.onload = () => {
      lucide.createIcons();
      setupSidebar();
      state.activeEvent = EVENTS[0];
      renderApp();
    };

    function setupSidebar() {
      const navGroup = document.getElementById('nav-group-discovery');
      const items = [
        { id: 'home', icon: 'compass', label: 'Browse' },
        { id: 'recent', icon: 'clock', label: 'Recently Added' },
        { id: 'saved', icon: 'heart', label: 'Saved Events' }
      ];

      navGroup.innerHTML = items.map(item => `
        <button onclick="switchView('${item.id}')" id="nav-${item.id}" class="w-full flex items-center px-3 py-2.5 text-sm font-semibold rounded-xl transition-all ${item.id === state.view ? 'bg-zinc-800 text-app-accent' : 'text-zinc-400 hover:text-white hover:bg-white/5'}">
          <i data-lucide="${item.icon}" class="w-4 h-4 mr-3 ${item.id === state.view ? 'text-app-accent' : 'text-zinc-500'}"></i>
          ${item.label}
        </button>
      `).join('');
      lucide.createIcons();
    }

    function switchView(viewName) {
      state.view = viewName;
      
      // Update Desktop Sidebar Highlights
      const allNavs = ['home', 'recent', 'saved', 'colleges', 'societies', 'manage'];
      allNavs.forEach(nav => {
        const el = document.getElementById(`nav-${nav}`);
        if(el) {
          if(nav === viewName) {
            el.className = 'w-full flex items-center px-3 py-2.5 text-sm font-semibold rounded-xl bg-zinc-800 text-app-accent transition-all';
            el.querySelector('i')?.classList.replace('text-zinc-500', 'text-app-accent');
          } else {
            el.className = 'w-full flex items-center px-3 py-2.5 text-sm font-semibold rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all';
            el.querySelector('i')?.classList.replace('text-app-accent', 'text-zinc-500');
          }
        }
      });

      // Update Mobile Nav Highlights
      const mobNavs = ['home', 'colleges', 'saved', 'manage'];
      mobNavs.forEach(nav => {
        const btn = document.getElementById(`mob-nav-${nav}`);
        if(btn) {
          if(nav === viewName) {
            btn.className = 'flex flex-col items-center justify-center w-16 h-full text-app-accent transition-colors';
          } else {
            btn.className = 'flex flex-col items-center justify-center w-16 h-full text-zinc-400 hover:text-white transition-colors';
          }
        }
      });

      // Reset panels
      closeMobileDetail();
      renderApp();
    }

    function setFilter(type) {
      state.filterType = type;
      const filters = ['ALL', 'Workshop', 'Conference', 'Competition'];
      filters.forEach(f => {
        const el = document.getElementById(`filter-${f}`);
        if(el) {
          el.className = (f === type) 
            ? 'text-zinc-900 border-b-2 border-zinc-900 pb-1 whitespace-nowrap shrink-0 transition-colors' 
            : 'hover:text-zinc-900 pb-1 whitespace-nowrap shrink-0 transition-colors';
        }
      });
      renderFeed();
    }

    function handleSearch() {
      state.searchQuery = document.getElementById('search-input').value.toLowerCase();
      renderFeed();
    }

    function selectEvent(id) {
      state.activeEvent = EVENTS.find(e => e.id === id);
      renderRightPanel();
      renderBottomBar();
      
      // Open panel on mobile
      if(window.innerWidth < 1024) {
        document.getElementById('detail-panel').classList.add('is-open');
      }
    }

    function closeMobileDetail() {
      document.getElementById('detail-panel').classList.remove('is-open');
    }

    function renderApp() {
      const container = document.getElementById('feed-container');
      
      if (state.view === 'home' || state.view === 'recent') {
        let html = '';
        
        const featured = EVENTS.find(e => e.featured) || EVENTS[0];
        html += `
          <div class="relative h-48 md:h-64 rounded-[20px] md:rounded-3xl overflow-hidden bg-zinc-900 flex items-end p-5 md:p-8 mb-8 shadow-md group cursor-pointer" onclick="selectEvent('${featured.id}')">
            <img src="${featured.image}" class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-700">
            <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-900/40 to-transparent"></div>
            <div class="relative z-10 text-white w-full max-w-2xl">
              <span class="text-[9px] md:text-[10px] font-extrabold tracking-widest text-app-accent uppercase mb-2 bg-app-accent/20 inline-block px-2.5 py-1 rounded-md">Curated</span>
              <h1 class="text-2xl md:text-4xl font-black mb-2 leading-tight tracking-tight">${featured.title.toUpperCase()}</h1>
              <p class="text-xs md:text-sm text-zinc-300 font-medium hidden sm:block">${featured.desc.substring(0, 80)}...</p>
            </div>
          </div>
        `;

        html += `
          <div class="mb-8">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-[15px] md:text-lg font-bold text-zinc-900 tracking-tight">Popular Institutions</h2>
              <button class="text-[11px] md:text-xs font-bold text-zinc-400 hover:text-zinc-900">See all</button>
            </div>
            <div class="flex items-center gap-4 md:gap-6 overflow-x-auto pb-4 no-scrollbar">
              ${COLLEGES.map(c => `
                <div class="flex flex-col items-center gap-2 md:gap-3 cursor-pointer group shrink-0">
                  <div class="w-16 h-16 md:w-24 md:h-24 rounded-full overflow-hidden shadow-sm group-hover:shadow-md transition-all group-hover:-translate-y-1">
                    <img src="${c.img}" class="w-full h-full object-cover">
                  </div>
                  <span class="text-[10px] md:text-xs font-semibold text-zinc-700 group-hover:text-zinc-900">${c.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;

        html += `
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-[15px] md:text-lg font-bold text-zinc-900 tracking-tight">Upcoming Schedule</h2>
          </div>
          <div id="events-list" class="space-y-2 md:space-y-1 pb-10"></div>
        `;
        
        container.innerHTML = html;
        renderFeed();
      } 
      else {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center px-4">
            <div class="w-16 h-16 bg-zinc-50 rounded-2xl flex items-center justify-center text-zinc-300 mb-4">
              <i data-lucide="layout-template" class="w-8 h-8"></i>
            </div>
            <h2 class="text-lg md:text-xl font-bold text-zinc-900 mb-2">View not fully implemented</h2>
            <p class="text-xs md:text-sm text-zinc-500 max-w-sm">The ${state.view} layout is omitted in this UI prototype to focus on the responsive discovery feed.</p>
          </div>
        `;
      }

      renderRightPanel();
      renderBottomBar();
      lucide.createIcons();
    }

    function renderFeed() {
      const list = document.getElementById('events-list');
      if(!list) return;

      let filtered = EVENTS.filter(e => {
        const matchesType = (state.filterType === 'ALL') || (e.type === state.filterType);
        const matchesSearch = e.title.toLowerCase().includes(state.searchQuery) || e.college.toLowerCase().includes(state.searchQuery);
        return matchesType && matchesSearch;
      });

      if(filtered.length === 0) {
        list.innerHTML = `<div class="p-6 md:p-8 text-center text-xs md:text-sm text-zinc-500 font-medium bg-zinc-50 rounded-2xl">No events found matching criteria.</div>`;
        return;
      }

      list.innerHTML = filtered.map(e => `
        <div onclick="selectEvent('${e.id}')" class="group flex items-center justify-between p-2.5 md:p-3 rounded-2xl hover:bg-zinc-50 transition-colors cursor-pointer ${state.activeEvent?.id === e.id ? 'bg-zinc-50 ring-1 ring-zinc-200' : ''}">
          
          <div class="flex items-center gap-3 md:gap-4 flex-1 overflow-hidden pr-2">
            <div class="relative w-12 h-12 md:w-14 md:h-14 rounded-xl overflow-hidden shrink-0 shadow-sm">
              <img src="${e.image}" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors"></div>
            </div>
            <div class="truncate flex-1">
              <h4 class="text-[13px] md:text-sm font-bold text-zinc-900 truncate group-hover:text-app-accent transition-colors">${e.title}</h4>
              <p class="text-[11px] font-semibold text-zinc-500 truncate">${e.society} <span class="md:hidden">• ${e.college}</span></p>
            </div>
          </div>
          
          <div class="hidden md:block w-1/4 text-xs font-semibold text-zinc-500 truncate pr-4 shrink-0">
            ${e.college}
          </div>
          
          <div class="hidden sm:block w-1/6 text-xs font-semibold text-zinc-500 text-right pr-4 shrink-0">
            ${e.time}
          </div>

          <button class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-400 hover:text-zinc-900 hover:bg-zinc-200 transition-colors shrink-0">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
      
      lucide.createIcons();
    }

    function renderRightPanel() {
      const panel = document.getElementById('right-panel-content');
      if(!panel || !state.activeEvent) return;

      const e = state.activeEvent;

      panel.innerHTML = `
        <div>
          <div class="w-full aspect-[4/3] lg:aspect-square rounded-2xl overflow-hidden mb-5 lg:mb-6 shadow-md relative">
            <img src="${e.image}" class="w-full h-full object-cover">
            <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-2.5 py-1 rounded-md text-[10px] font-bold text-zinc-800 uppercase shadow-sm">
              ${e.type}
            </div>
          </div>
          
          <div class="mb-5 lg:mb-6">
            <h3 class="text-xl lg:text-2xl font-black text-zinc-900 leading-tight mb-1.5">${e.title}</h3>
            <p class="text-[13px] font-bold text-app-accent">${e.college} • ${e.society}</p>
          </div>
          
          <div class="space-y-3 lg:space-y-4 mb-6 lg:mb-8">
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center shrink-0 border border-zinc-100">
                <i data-lucide="calendar" class="w-4 h-4 text-zinc-500"></i>
              </div>
              <div>
                <p class="text-xs font-bold text-zinc-900">${e.date}</p>
                <p class="text-[11px] text-zinc-500 font-medium">${e.time} • ${e.duration}</p>
              </div>
            </div>
            
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center shrink-0 border border-zinc-100">
                <i data-lucide="map-pin" class="w-4 h-4 text-zinc-500"></i>
              </div>
              <div>
                <p class="text-xs font-bold text-zinc-900">${e.venue}</p>
                <p class="text-[11px] text-zinc-500 font-medium">On-Campus Location</p>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-xl p-4 shadow-sm border border-zinc-100">
            <h4 class="text-[11px] font-bold text-zinc-900 uppercase tracking-wide mb-2">About Event</h4>
            <p class="text-[13px] lg:text-[11px] text-zinc-500 leading-relaxed font-medium">
              ${e.desc}
            </p>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderBottomBar() {
      const title = document.getElementById('bb-title');
      const sub = document.getElementById('bb-subtitle');
      const img = document.getElementById('bb-img');
      const start = document.getElementById('bb-time-start');
      const end = document.getElementById('bb-time-end');

      if(state.activeEvent) {
        title.innerText = state.activeEvent.title;
        sub.innerText = state.activeEvent.society;
        img.src = state.activeEvent.image;
        img.classList.remove('hidden');
        if(start) start.innerText = state.activeEvent.time;
        if(end) end.innerText = state.activeEvent.duration;
      }
    }

    function registerActiveEvent() {
      if(!state.activeEvent) return;
      alert(`Registration process initiated for:\n${state.activeEvent.title}`);
    }
  </script>
</body>
</html>
