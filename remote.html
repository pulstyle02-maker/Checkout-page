<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blockify Remote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-main: #0e1116;
            --bg-card: #161b22;
            --text-main: #f0f6fc;
            --border-c: #30363d;
            --btn-red: #ef4444;
            --btn-orange: #f59e0b;
            --btn-green: #10b981;
            --btn-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Connection Screen */
        #connect-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        input {
            width: 100%;
            max-width: 300px;
            padding: 16px;
            font-size: 24px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid var(--border-c);
            background: var(--bg-card);
            color: white;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn-connect {
            background: var(--btn-blue);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }

        /* Remote Screen */
        #remote-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            gap: 16px;
        }
        
        .status-bar {
            text-align: center;
            font-size: 14px;
            color: var(--btn-green);
            font-weight: 700;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
        }

        .btn-show {
            flex: 1;
            background: var(--bg-card);
            border: 2px dashed var(--border-c);
            border-radius: 16px;
            color: white;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-show:active { transform: scale(0.95); background: #21262d; }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            flex: 1;
        }

        .btn-action {
            border: none;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:active { transform: scale(0.92); opacity: 0.8; }

        .btn-again { background-color: var(--btn-red); }
        .btn-hard { background-color: var(--btn-orange); }
        .btn-good { background-color: var(--btn-green); }
        .btn-easy { background-color: var(--btn-blue); }

    </style>
</head>
<body>

    <!-- Connect Screen -->
    <div id="connect-screen">
        <h1 style="margin-bottom: 8px;">Anki Remote</h1>
        <p style="color: #8b949e; text-align: center; margin-bottom: 40px;">Enter the 5-letter code shown on your iPad to connect.</p>
        
        <input type="text" id="peer-id-input" placeholder="XXXXX" maxlength="5" autocomplete="off">
        <button class="btn-connect" id="connect-btn">Connect</button>
        <div id="error-msg" style="color: var(--btn-red); margin-top: 20px; font-weight: bold; display: none;">Connection Failed</div>
    </div>

    <!-- Remote Control Screen -->
    <div id="remote-screen">
        <div class="status-bar">● Connected to Main App</div>
        
        <button class="btn-show" onclick="sendCommand('SHOW_ANSWER')">
            Show Answer
        </button>

        <div class="action-grid">
            <button class="btn-action btn-again" onclick="sendCommand('AGAIN')">Again</button>
            <button class="btn-action btn-hard" onclick="sendCommand('HARD')">Hard</button>
            <button class="btn-action btn-good" onclick="sendCommand('GOOD')">Good</button>
            <button class="btn-action btn-easy" onclick="sendCommand('EASY')">Easy</button>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;

        const connectScreen = document.getElementById('connect-screen');
        const remoteScreen = document.getElementById('remote-screen');
        const errorMsg = document.getElementById('error-msg');
        
        document.getElementById('connect-btn').addEventListener('click', () => {
            const code = document.getElementById('peer-id-input').value.toUpperCase().trim();
            if(code.length !== 5) {
                errorMsg.innerText = "Please enter a valid 5-letter code";
                errorMsg.style.display = 'block';
                return;
            }

            const targetId = 'BLOCKIFY-' + code;
            document.getElementById('connect-btn').innerText = "Connecting...";

            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(targetId);

                conn.on('open', () => {
                    // Success! Switch UI
                    connectScreen.style.display = 'none';
                    remoteScreen.style.display = 'flex';
                    if (navigator.vibrate) navigator.vibrate(100);
                });

                conn.on('close', () => {
                    alert("Disconnected from main app.");
                    location.reload();
                });
            });

            peer.on('error', (err) => {
                document.getElementById('connect-btn').innerText = "Connect";
                errorMsg.innerText = "Could not connect. Check code.";
                errorMsg.style.display = 'block';
            });
        });

        // Trigger Haptic feedback and send data
        function sendCommand(action) {
            if (navigator.vibrate) {
                // Short buzz for generic actions, double buzz for 'Show Answer'
                if(action === 'SHOW_ANSWER') navigator.vibrate([30, 50, 30]);
                else navigator.vibrate(40);
            }
            if (conn && conn.open) {
                conn.send(action);
            }
        }
    </script>
</body>
</html>
